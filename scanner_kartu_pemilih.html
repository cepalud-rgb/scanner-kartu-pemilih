<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Scan Kartu Pemilih</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0b1220;color:#fff;font-family:Arial,sans-serif}
    .card{width:min(100%,480px);padding:22px;border-radius:22px;background:#111827;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:24px}
    p{color:#cbd5e1;line-height:1.5}
    #reader{width:100%;min-height:280px;overflow:hidden;border-radius:16px;background:#000;margin-top:18px}
    #reader video{width:100%!important;height:auto!important}
    #status{min-height:48px;margin:16px 0;font-weight:700}
    button{width:100%;padding:14px;border:0;border-radius:14px;background:#374151;color:#fff;font-size:16px;font-weight:700}
    .ok{color:#86efac}.bad{color:#fca5a5}.info{color:#fde68a}
  </style>
</head>
<body>
  <main class="card">
    <h1>Scan Kartu Pemilih</h1>
    <p>Arahkan kamera belakang ke QR Code pada kartu pemilih.</p>
    <div id="reader"></div>
    <div id="status" class="info">Menyiapkan kamera...</div>
    <button id="closeBtn" type="button">Kembali</button>
  </main>

<script>
const VALID_CODE = "123456";
const RETURN_URL = "https://simulasipildes.my.canva.site/";
let scanner = null;
let running = false;
let handled = false;

function setStatus(message, type="info"){
  const el = document.getElementById("status");
  el.textContent = message;
  el.className = type;
}

async function stopScanner(){
  if(!scanner) return;
  try{
    if(running) await scanner.stop();
  }catch(e){ console.warn("stop:",e); }
  try{
    await scanner.clear();
  }catch(e){ console.warn("clear:",e); }
  running=false;
  scanner=null;
}

async function startScanner(){
  if(!window.Html5Qrcode){
    setStatus("Scanner belum siap. Muat ulang halaman.","bad");
    return;
  }

  scanner = new Html5Qrcode("reader");

  try{
    await scanner.start(
      {facingMode:{ideal:"environment"}},
      {fps:10, qrbox:{width:250,height:250}},
      async (decodedText)=>{
        if(handled) return;
        const code=String(decodedText).trim();

        if(code !== VALID_CODE){
          setStatus("Kode QR tidak valid. Silakan scan kartu pemilih yang benar.","bad");
          return;
        }

        handled=true;
        setStatus("Kode benar. Membuka halaman pemilihan...","ok");
        await stopScanner();

        // Parameter ini akan dipakai pada tahap integrasi dengan Canva.
        window.location.href=RETURN_URL+"?qr=123456";
      },
      ()=>{}
    );

    running=true;
    setStatus("Kamera aktif. Arahkan ke QR Code.","ok");
  }catch(error){
    console.error("QR CAMERA ERROR:",error);
    if(error?.name==="NotAllowedError")
      setStatus("Izin kamera ditolak. Izinkan kamera untuk situs ini lalu muat ulang.","bad");
    else if(error?.name==="NotFoundError")
      setStatus("Kamera tidak ditemukan pada perangkat.","bad");
    else if(error?.name==="NotReadableError")
      setStatus("Kamera sedang digunakan aplikasi lain.","bad");
    else
      setStatus("Kamera gagal dibuka: "+(error?.name||"UnknownError"),"bad");
  }
}

document.getElementById("closeBtn").addEventListener("click",async()=>{
  await stopScanner();
  window.location.href=RETURN_URL;
});

window.addEventListener("pagehide",()=>{stopScanner();});
startScanner();
</script>
</body>
</html>
